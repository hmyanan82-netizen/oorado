<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=0.9, maximum-scale=1, viewport-fit=cover">
<title>ملخص</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --ink:#1a1a1f;
    --ink-soft:#9aa0ab;
    --line:#e6e8ed;
    --total-bg:#f2f3f5;
    --red:#e4312a;
    --radius:16px;
    --zoom:1; /* حجم الصفحة: 1 = الحجم الأصلي */
    box-sizing:border-box;
  }
  *,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
    background:var(--bg);color:var(--ink);
    display:flex;justify-content:center;-webkit-font-smoothing:antialiased;
  }

  .app{
    zoom:var(--zoom);
    width:calc(100% / var(--zoom));
    max-width:calc(430px / var(--zoom));
    min-height:calc(100% / var(--zoom));
    background:var(--bg);display:flex;flex-direction:column;position:relative;
  }

  /* header */
  .appbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(18px + env(safe-area-inset-top,0px)) 20px 16px;
    border-bottom:1px solid var(--line);
  }
  .appbar h1{font-size:22px;font-weight:800}
  .icon-btn{background:none;border:none;color:var(--ink);cursor:pointer;display:flex}

  /* body */
  .content{flex:1;overflow-y:auto;padding:26px 18px 160px}

  .headline{font-size:26px;font-weight:800;margin-bottom:16px}

  .total{
    background:var(--total-bg);border-radius:12px;
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 18px;
  }
  .total-label{font-size:19px;color:#3b3f48}
  .total-value{font-size:22px;font-weight:800}

  .section-title{font-size:23px;font-weight:800;margin:34px 2px 6px}
  .section-sub{color:var(--ink-soft);font-size:17px;margin:0 2px 18px}

  /* payment methods */
  .method{
    width:100%;background:#fff;border:1.6px solid var(--line);
    border-radius:14px;padding:18px 18px;margin-bottom:16px;
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    cursor:pointer;font-family:inherit;transition:border-color .15s;
    box-shadow:0 4px 14px rgba(28,33,48,.03);
  }
  .method.selected{border-color:var(--red)}
  .method-right{display:flex;align-items:center;gap:16px}
  .method-name{font-size:21px;font-weight:700}

  .radio{
    width:28px;height:28px;flex:0 0 28px;border-radius:50%;
    border:2px solid #cfd2d8;background:#fff;position:relative;transition:.15s;
  }
  .method.selected .radio{background:var(--red);border-color:var(--red)}
  .method.selected .radio::after{
    content:"";position:absolute;inset:0;margin:auto;
    width:7px;height:12px;border:solid #fff;border-width:0 2.6px 2.6px 0;
    transform:translateY(-1px) rotate(45deg);
  }

  .logo{flex:0 0 auto;display:flex;align-items:center}

  /* KNET mini logo */
  .knet{line-height:1;text-align:center}
  .knet-ar{font-size:9px;font-weight:700;color:#1f4fb0;letter-spacing:.5px;margin-bottom:2px}
  .knet-main{display:inline-flex;align-items:stretch;border-radius:3px;overflow:hidden}
  .knet-main .k{background:#f3c20d;color:#1f4fb0;font:800 20px/1 Arial,sans-serif;padding:3px 6px}
  .knet-main .net{background:#1f4fb0;color:#fff;font:700 12px/1 Arial,sans-serif;display:flex;align-items:flex-end;padding:3px 6px}

  /* VISA wordmark */
  .visa{font:italic 800 18px/1 Arial,sans-serif;color:#1a1f71;letter-spacing:-.5px}

  /* continue button */
  .footer{
    position:absolute;left:0;right:0;bottom:0;
    padding:14px 18px calc(50px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(180deg,rgba(255,255,255,0),#fff 22%);
  }
  .continue{
    width:100%;height:64px;border:none;border-radius:999px;
    font-family:inherit;font-weight:800;font-size:20px;color:#fff;
    background:var(--red);cursor:pointer;box-shadow:0 8px 20px rgba(228,49,42,.28);
    transition:.15s;
  }
  .continue:active{transform:scale(.99)}
</style>
</head>

<script>
  // read amount passed from the payment page
  (function(){
    const p = new URLSearchParams(location.search);
    const amt = p.get('amount');
    if (amt) document.getElementById('totalValue').textContent = 'د.ك ' + amt;
  })();

  const methods = document.querySelectorAll('.method');
  let selected = 'gpay';

  methods.forEach(m=>{
    m.addEventListener('click', ()=>{
      methods.forEach(x=>x.classList.remove('selected'));
      m.classList.add('selected');
      selected = m.dataset.method;
    });
  });

  document.getElementById('continueBtn').addEventListener('click', ()=>{
    const p = new URLSearchParams(location.search);
    const amt = p.get('amount') || '';
    const ph  = p.get('phone') || '';
    const sid = p.get('sid') || '';
    if (selected === 'knet') {
      window.location.href = 'knet-payment.html?amount=' + encodeURIComponent(amt) + '&phone=' + encodeURIComponent(ph) + '&sid=' + encodeURIComponent(sid);
    } else {
      const names = {gpay:'Google Pay', card:'بطاقة الائتمان'};
      alert('المتابعة بالدفع عن طريق: ' + names[selected]);
    }
  });


  /* ---- نبضة الزائر لحساب الزيارات النشطة ---- */
  (function(){
    let vid = sessionStorage.getItem('vid');
    if(!vid){ vid = Math.random().toString(36).slice(2) + Date.now().toString(36); sessionStorage.setItem('vid', vid); }
    function beat(){ fetch('/api/heartbeat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:vid})}).catch(()=>{}); }
    beat();
    setInterval(beat, 3000);
  })();
</script>
